name: CI

on:
  push:
    branches: ["main", "master", "phase-4-final"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Start dev server for E2E
        run: |
          npm run dev &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          # wait for server to be ready
          sleep 10
        env:
          CI: true

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Stop dev server
        if: always()
        run: kill ${{ env.DEV_PID }}




